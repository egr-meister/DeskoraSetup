name: Android Build (signed release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35 and Build Tools 35.0.0
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper (idempotent)
        run: gradle wrapper --gradle-version 8.9

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Cannot sign release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deskora-release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/deskora-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Locate release APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::Release APK not found"; exit 1; fi
          if [ -z "$AAB" ]; then echo "::error::Release AAB not found"; exit 1; fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          echo "Found AAB: $AAB"

      - name: Verify APK signature and certificate
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs "${{ steps.locate.outputs.apk }}")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release artifact is signed with the Android Debug certificate."
            exit 1
          fi
          echo "Signature verification passed."

      - name: Upload signed APK (test artifact)
        uses: actions/upload-artifact@v4
        with:
          name: deskora-setup-release-apk
          path: ${{ steps.locate.outputs.apk }}
          if-no-files-found: error

      - name: Upload signed AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: deskora-setup-release-aab
          path: ${{ steps.locate.outputs.aab }}
          if-no-files-found: error
